<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系統健康檢查 — EDB 通告智能分析系統</title>
<style>
  :root{
    --bg:#f8fafc; --card:#fff; --tile:#f8fafc; --ink:#1e293b; --muted:#64748b;
    --line:#e2e8f0; --neutral:#cbd5e1; --accent:#2563eb;
    --ok:#059669;   --ok-bg:#ecfdf5;   --ok-line:#a7f3d0;
    --warn:#d97706; --warn-bg:#fffbeb; --warn-line:#fde68a;
    --err:#dc2626;  --err-bg:#fef2f2;  --err-line:#fecaca;
    --block:#b91c1c;--block-bg:#fef2f2;--block-line:#fca5a5;
    --shadow:0 1px 3px rgba(15,23,42,.07), 0 1px 2px rgba(15,23,42,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --tile:#172033; --ink:#e2e8f0; --muted:#94a3b8;
      --line:#334155; --neutral:#475569; --accent:#60a5fa;
      --ok:#34d399;   --ok-bg:#052e21;   --ok-line:#065f46;
      --warn:#fbbf24; --warn-bg:#38280a; --warn-line:#92610a;
      --err:#f87171;  --err-bg:#3b1214;  --err-line:#991b1b;
      --block:#fca5a5;--block-bg:#450a0a;--block-line:#b91c1c;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 20px 72px;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,
    "PingFang HK","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto}

  header{margin-bottom:22px}
  h1{font-size:23px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--muted);font-size:13.5px;line-height:1.7}
  .lede strong{color:var(--ink);font-weight:600}

  /* ── status hero ─────────────────────────────────────────── */
  .hero{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);margin-bottom:24px}
  .hero .glyph{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;
    place-items:center;font-size:24px;background:var(--bg)}
  .hero .body{flex:1;min-width:0}
  .hero .big{font-size:18px;font-weight:700;line-height:1.35}
  .hero .why{font-size:13px;color:var(--muted);margin-top:3px}
  .hero .when{flex:0 0 auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
  .hero.ok   {background:var(--ok-bg);   border-color:var(--ok-line)}
  .hero.ok    .big,.hero.ok    .glyph{color:var(--ok)}
  .hero.warn {background:var(--warn-bg); border-color:var(--warn-line)}
  .hero.warn  .big,.hero.warn  .glyph{color:var(--warn)}
  .hero.err  {background:var(--err-bg);  border-color:var(--err-line)}
  .hero.err   .big,.hero.err   .glyph{color:var(--err)}
  .hero.block{background:var(--block-bg);border-color:var(--block-line)}
  .hero.block .big,.hero.block .glyph{color:var(--block)}

  /* ── section card ────────────────────────────────────────── */
  .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);
    padding:22px 24px;margin-bottom:20px}
  .card > h2{font-size:15px;font-weight:700;margin:0;padding-bottom:14px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .card > h2 .hint{margin-left:auto;font-size:12px;font-weight:400;color:var(--muted)}
  .card .body{margin-top:18px}
  .note{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.7}

  /* ── metric tiles ────────────────────────────────────────── */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
  .tile{background:var(--tile);border:2px solid var(--neutral);border-radius:10px;
    padding:15px 16px;text-align:center}
  .tile .v{font-size:25px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
  .tile .k{font-size:12px;color:var(--muted);margin-top:5px}
  .tile.t-ok   {border-color:var(--ok)}    .tile.t-ok    .v{color:var(--ok)}
  .tile.t-warn {border-color:var(--warn)}  .tile.t-warn  .v{color:var(--warn)}
  .tile.t-err  {border-color:var(--err)}   .tile.t-err   .v{color:var(--err)}
  .tile.t-block{border-color:var(--block)} .tile.t-block .v{color:var(--block)}

  /* ── check table ─────────────────────────────────────────── */
  .tw{overflow-x:auto;margin:0 -4px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:0 12px 10px;color:var(--muted);font-weight:600;font-size:12px;
    border-bottom:1px solid var(--line)}
  td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .cname{font-weight:600}
  .cid{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    margin-top:2px}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;
    letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
  .p-PASS   {background:var(--ok-bg);   color:var(--ok);   border-color:var(--ok-line)}
  .p-INFO   {background:var(--bg);      color:var(--muted);border-color:var(--line)}
  .p-WARN   {background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line)}
  .p-ERROR  {background:var(--err-bg);  color:var(--err);  border-color:var(--err-line)}
  .p-BLOCKER{background:var(--block-bg);color:var(--block);border-color:var(--block-line)}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600}
  .off{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
    color:var(--muted);margin:8px 0 0;padding:10px 12px;background:var(--bg);
    border-radius:8px;white-space:pre-wrap;word-break:break-all;line-height:1.7}

  /* ── ops commands ────────────────────────────────────────── */
  .cmd{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line)}
  .cmd:first-child{padding-top:0}
  .cmd:last-child{border-bottom:0;padding-bottom:0}
  .cmd .txt{flex:1;min-width:0}
  .cmd .lbl{font-size:13.5px;font-weight:700}
  .cmd .desc{font-size:12.5px;color:var(--muted);margin-top:2px}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cmd code{display:block;font-size:11.5px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:9px 11px;margin-top:8px;white-space:pre-wrap;word-break:break-all;
    line-height:1.65}
  button{cursor:pointer;background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:7px 15px;font-size:12.5px;font-weight:600;white-space:nowrap;
    transition:opacity .15s}
  button:hover{opacity:.85}
  button.danger{background:var(--err)}
  pre.json{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    overflow-x:auto;font-size:11.5px;line-height:1.7;margin:0}
  .inline-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:30px;line-height:1.8}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);
    color:var(--bg);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;
    opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .toast.on{opacity:1}
  @media (max-width:560px){
    body{padding:20px 14px 56px}
    .hero{flex-wrap:wrap}
    .hero .when{width:100%;text-align:left;padding-left:62px}
    .card{padding:18px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏥 系統健康檢查</h1>
    <div class="lede">
      每次排程發佈時自動產生 · 不與主 Dashboard 互連 · 僅供管理者及 AI Agent 查閱<br>
      <strong>新鮮度由你的瀏覽器即時計算</strong>，即使整條管線已經停止、本頁不再更新，下方仍會轉為紅色。
    </div>
  </header>

  <div id="hero" class="hero">
    <div class="glyph">⏳</div>
    <div class="body"><div class="big">載入中…</div></div>
  </div>

  <div class="card">
    <h2>📊 資料狀態</h2>
    <div class="body"><div class="tiles" id="mData"></div></div>
  </div>

  <div class="card">
    <h2>✅ 檢查結果<span class="hint" id="checkHint"></span></h2>
    <div class="body"><div class="tiles" id="mChecks"></div></div>
  </div>

  <div class="card">
    <h2>🔍 完整檢查清單</h2>
    <div class="body"><div class="tw"><table>
      <thead><tr><th style="width:1%">狀態</th><th style="width:34%">檢查</th><th>詳情</th></tr></thead>
      <tbody id="checks"><tr><td colspan="3" style="color:var(--muted)">載入中…</td></tr></tbody>
    </table></div></div>
  </div>

  <div class="card">
    <h2>🛠️ 運維指令<span class="hint">點擊複製，於終端機貼上執行</span></h2>
    <div class="body"><div id="cmds"></div></div>
  </div>

  <div class="card">
    <h2>⚙️ 機器可讀狀態<span class="hint">供 AI Agent 讀取</span></h2>
    <div class="body">
      <p class="note">同樣內容可直接抓取：<span class="inline-code">circular.wongfu.net/qc_report.json</span></p>
      <pre class="json" id="raw">載入中…</pre>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast">已複製到剪貼簿</div>

<script>
'use strict';
var BACKEND = 'Leonard-Wong-Git/EDB-AI-Circular-System';
var PUBLIC  = 'Leonard-Wong-Git/edb-circular-site';
// 排程約每 8 小時一次。14 小時 = 錯過一次；24 小時 = 錯過兩次或以上。
var WARN_H = 14, ERR_H = 24;

function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// 以瀏覽器時鐘計算，而非生成時寫死的數字 —— 管線停止後本頁不再更新，此值仍會繼續增長。
function ago(iso){var t=Date.parse(iso); return isNaN(t)?null:(Date.now()-t)/36e5;}
function fmtAge(hrs){
  if(hrs==null) return '無法解析';
  if(hrs<1) return Math.round(hrs*60)+' 分鐘前';
  if(hrs<48) return hrs.toFixed(1)+' 小時前';
  return (hrs/24).toFixed(1)+' 日前';
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},1600);}
function copy(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){toast('已複製到剪貼簿');},
      function(){toast('複製失敗，請手動選取');});
  } else { toast('此環境不支援自動複製，請手動選取'); }
}

var COMMANDS = [
  {l:'手動觸發抓取與發佈', d:'等同一次排程。會執行 QC 閘，攔截級未通過即不會發佈。',
   c:'gh workflow run "Scrape + Publish Artifact" --repo '+BACKEND},
  {l:'查看後端排程紀錄', d:'最近 10 次抓取與發佈的結果。',
   c:'gh run list --repo '+BACKEND+' --limit 10'},
  {l:'查看公開站部署紀錄', d:'Pages 是否成功部署 —— 後端顯示成功不代表已經上線。',
   c:'gh run list --repo '+PUBLIC+' --limit 10'},
  {l:'本機對線上資料執行 QC', d:'無須等待排程，即時得知線上資料的狀態。',
   c:'curl -s https://circular.wongfu.net/circulars.json -o /tmp/live.json && \\\n'+
     'python3.13 dev/tools/qc_circulars.py --json /tmp/live.json --dashboard edb-dashboard.html'},
  {l:'⚠️ 由歷史版本還原資料檔', d:'資料倒退時使用。先查看歷史、選定 SHA，再行還原。2026-09-01 曾經使用。',
   danger:true,
   c:'cd ~/Documents/EDB-AI-Circular-System && git log --oneline -20 -- circulars.json\n'+
     '# 選定 <SHA> 之後：\n'+
     'git fetch origin main && git reset --hard origin/main && \\\n'+
     'git checkout <SHA> -- circulars.json && \\\n'+
     'git commit -m "fix: restore feed" && git push origin main'},
  {l:'⚠️ 暫停排程', d:'懷疑管線出現問題，需要暫停調查時使用。', danger:true,
   c:'gh workflow disable "Scrape + Publish Artifact" --repo '+BACKEND},
  {l:'恢復排程', d:'調查完畢後重新啟用。',
   c:'gh workflow enable "Scrape + Publish Artifact" --repo '+BACKEND}
];

function renderCommands(){
  document.getElementById('cmds').innerHTML = COMMANDS.map(function(x,i){
    return '<div class="cmd"><div class="txt"><div class="lbl">'+h(x.l)+'</div>'+
      '<div class="desc">'+h(x.d)+'</div><code>'+h(x.c)+'</code></div>'+
      '<button class="'+(x.danger?'danger':'')+'" data-i="'+i+'">複製</button></div>';
  }).join('');
  document.getElementById('cmds').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    copy(COMMANDS[+b.getAttribute('data-i')].c);
  });
}

function tiles(el, items){
  document.getElementById(el).innerHTML = items.map(function(t){
    return '<div class="tile '+(t[2]||'')+'"><div class="v">'+h(t[1])+
           '</div><div class="k">'+h(t[0])+'</div></div>';
  }).join('');
}

function setHero(cls, glyph, big, why, when){
  var el=document.getElementById('hero');
  el.className='hero '+cls;
  el.innerHTML='<div class="glyph">'+glyph+'</div><div class="body"><div class="big">'+h(big)+
    '</div>'+(why?'<div class="why">'+h(why)+'</div>':'')+'</div>'+
    (when?'<div class="when">'+h(when)+'</div>':'');
}

function render(feed, qc, feedErr, qcErr){
  var age  = feed ? ago(feed.generated_at) : null;
  var stale= age==null || age>=ERR_H;
  var aging= age!=null && age>=WARN_H && age<ERR_H;
  var worst= qc ? qc.overallStatus : null;
  var when = qc && qc.generatedAt ? '報告產生於\n'+qc.generatedAt.replace('T',' ').slice(0,19)+' UTC' : '';

  if(feedErr)                   setHero('block','⛔','無法取得資料檔','circulars.json 抓取失敗 —— 網站可能出現問題：'+feedErr, when);
  else if(stale)                setHero('block','⛔','資料已停止更新','最後更新 '+fmtAge(age)+'（門檻 '+ERR_H+' 小時）—— 排程或發佈已經中斷。', when);
  else if(aging)                setHero('warn','⚠️','資料偏舊','最後更新 '+fmtAge(age)+'（門檻 '+WARN_H+' 小時）—— 可能已經錯過一次排程。', when);
  else if(qcErr)                setHero('warn','⚠️','資料新鮮，但無法取得 QC 報告','qc_report.json：'+qcErr, when);
  else if(worst==='BLOCKER')    setHero('block','⛔','QC 有攔截級問題','發佈已被阻止，詳情見下方檢查清單。', when);
  else if(worst==='ERROR')      setHero('err','❌','QC 有錯誤級問題','資料已經發佈（初期只攔截 BLOCKER），但以下項目需要跟進。', when);
  else if(worst==='WARN')       setHero('warn','⚠️','QC 有警告','資料正常，有次要項目可供跟進。', when);
  else                          setHero('ok','✅','全部正常','資料新鮮，所有檢查通過。', when);

  var c  = (qc && qc.counts) || {};
  var ss = (qc && qc.sourceStatus) || {};
  var n  = function(v){return v!=null ? v : '—';};
  var freshCls = stale ? 't-block' : (aging ? 't-warn' : (age==null ? '' : 't-ok'));

  tiles('mData', [
    ['記錄數',   feed ? (feed.circulars||[]).length : '—', ''],
    ['資料更新', fmtAge(age), freshCls],
    ['版本',     (qc && qc.version) || '—', ''],
    // 教育局按滾動窗口撤走舊通告原文，此數字會逐步上升 —— 屬於常態，並非故障，
    // 因此刻意不着色。單次之內暴增由 QC 的 SOURCE_AVAILABILITY 負責告警。
    ['原文已撤回', n(ss.withdrawn), ''],
    ['原文可用',   n(ss.available), '']
  ]);
  tiles('mChecks', [
    ['通過', n(c.PASS),    c.PASS    ? 't-ok'    : ''],
    ['警告', n(c.WARN),    c.WARN    ? 't-warn'  : 't-ok'],
    ['錯誤', n(c.ERROR),   c.ERROR   ? 't-err'   : 't-ok'],
    ['攔截', n(c.BLOCKER), c.BLOCKER ? 't-block' : 't-ok']
  ]);
  document.getElementById('checkHint').textContent =
    qc && qc.checks ? '共 '+qc.checks.length+' 項' : '';

  var body=document.getElementById('checks');
  if(!qc || !qc.checks){
    body.innerHTML='<tr><td colspan="3" style="color:var(--muted)">未有 QC 報告（'+
      h(qcErr||'檔案不存在')+'）—— 下一次排程會產生。</td></tr>';
  } else {
    body.innerHTML=qc.checks.map(function(f){
      var off='';
      if(f.status!=='PASS' && f.offenders && f.offenders.length){
        var more=f.offender_total>f.offenders.length
          ? '\n… 另有 '+(f.offender_total-f.offenders.length)+' 項' : '';
        off='<details><summary>展開 '+f.offender_total+' 項</summary><div class="off">'+
            h(f.offenders.join('\n')+more)+'</div></details>';
      }
      return '<tr><td><span class="pill p-'+h(f.status)+'">'+h(f.status)+'</span></td>'+
             '<td><div class="cname">'+h(f.label)+'</div><div class="cid">'+h(f.id)+'</div></td>'+
             '<td>'+h(f.detail)+off+'</td></tr>';
    }).join('');
  }

  document.getElementById('raw').textContent=JSON.stringify({
    viewedAt:new Date().toISOString(),
    feedAgeHours:age==null?null:+age.toFixed(2),
    freshness:stale?'STALE':(aging?'AGING':'FRESH'),
    records:feed?(feed.circulars||[]).length:null,
    sourceStatus:qc?(qc.sourceStatus||null):null,
    feedGeneratedAt:feed?feed.generated_at:null,
    qc:qc?{generatedAt:qc.generatedAt,overallStatus:qc.overallStatus,version:qc.version,
           counts:qc.counts,
           failing:qc.checks.filter(function(f){return f.status!=='PASS'&&f.status!=='INFO';})
                            .map(function(f){return {id:f.id,status:f.status,detail:f.detail};})}
        :null
  },null,2);

  document.getElementById('foot').textContent='本頁載入於 '+new Date().toISOString();
}

function grab(url){
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  });
}

renderCommands();
Promise.all([
  grab('./circulars.json').then(function(d){return {d:d};},function(e){return {e:e.message};}),
  grab('./qc_report.json').then(function(d){return {d:d};},function(e){return {e:e.message};})
]).then(function(res){ render(res[0].d,res[1].d,res[0].e,res[1].e); });
</script>
</body>
</html>
